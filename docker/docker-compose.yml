services:
  backend:
    build:
      context: ../backend # actual project code
      dockerfile: ../docker/Dockerfile.backend
    container_name: backend
    environment:
      ENV: "${ENV}"  
    volumes:
      - ../backend:/app
      - /app/__pycache__
      - /app/**/__pycache__
      - /app/venv
    ports:
      - "8000:8000"
    restart: always
    command: >
      sh -c 'if [ "$ENV" = "dev" ]; then
               uvicorn main:app --host 0.0.0.0 --port 8000 --reload;
             else
               uvicorn main:app --host 0.0.0.0 --port 8000;
             fi'

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/out
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
